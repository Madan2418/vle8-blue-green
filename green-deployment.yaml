apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-app
      version: green
  template:
    metadata:
      labels:
        app: vle8-app
        version: green
    spec:
      containers:
      - name: vle8-container
        image: vle8-app:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 80
