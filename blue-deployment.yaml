apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-app
      version: blue
  template:
    metadata:
      labels:
        app: vle8-app
        version: blue
    spec:
      containers:
      - name: vle8-container
        image: vle8-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
